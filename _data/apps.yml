- id: wca-2030-explorer
  name: "WCA 2030 Explorer"
  category_en: "Agricultural census methodology"
  category_fr: "Méthodologie des recensements agricoles"
  challenge_en: "Census teams need reliable access to detailed methodological guidance, including when internet access is limited."
  challenge_fr: "Les équipes de recensement ont besoin d'accéder à des directives fiables, y compris hors connexion."
  solution_en: "An offline-capable progressive web app that retrieves verbatim passages from WCA 2030 guidance with section and page citations rather than generating unsupported answers."
  solution_fr: "Une application web progressive utilisable hors connexion qui restitue des extraits textuels des directives WCA 2030 avec références aux sections et pages."
  value_en: "Helps practitioners locate source-grounded guidance and review the original text."
  value_fr: "Facilite la recherche de directives vérifiables et la consultation des textes d'origine."
  technologies: ["Vite", "Transformers.js", "MiniSearch BM25", "PWA"]
  repository: "https://github.com/bakodramane/WCA_2030_Explorer"
- id: pipeline-ac-mr-tmr
  name: "AC Metadata Review & Tables of Main Results"
  category_en: "Agricultural census documentation"
  category_fr: "Documentation des recensements agricoles"
  challenge_en: "Reviewing census metadata and extracting results from national documentation is time-intensive."
  challenge_fr: "La revue des métadonnées et l'extraction des résultats issus des documents nationaux mobilisent beaucoup de temps."
  solution_en: "A desktop tool that supports structured metadata review and tables of main results from agricultural census documents using LLM APIs."
  solution_fr: "Un outil de bureau utilisant des API de modèles de langage pour structurer la revue de métadonnées et les tableaux des principaux résultats de recensement."
  value_en: "Supports reviewable, standardised documentation; generated material requires expert validation."
  value_fr: "Contribue à une documentation structurée et vérifiable ; les résultats générés doivent être validés par des experts."
  technologies: ["TypeScript", "LLM APIs", "Metadata"]
  repository: "https://github.com/bakodramane/PIPELINE_AC_MR_TMR"
- id: data-cleaning
  name: "Data Cleaning Syntax App"
  screenshot: "https://raw.githubusercontent.com/bakodramane/DATA_CLEANING_SYNTAX_APP/main/docs/screenshots/syntax-preview.png"
  screenshot_alt_en: "Data Cleaning Syntax App interface showing a generated syntax preview"
  screenshot_alt_fr: "Interface de Data Cleaning Syntax App présentant un aperçu de la syntaxe générée"
  category_en: "Survey data quality"
  category_fr: "Qualité des données d'enquête"
  challenge_en: "Producing consistent validation, cleaning and imputation code across statistical packages is demanding."
  challenge_fr: "La création de syntaxes cohérentes de contrôle, de nettoyage et d'imputation dans plusieurs logiciels est exigeante."
  solution_en: "An offline-first application that uses data dictionaries and metadata to prepare auditable syntax for SPSS, Stata, R and Python."
  solution_fr: "Une application principalement hors connexion qui exploite les dictionnaires de données pour préparer des syntaxes vérifiables dans SPSS, Stata, R et Python."
  value_en: "Encourages documented, reproducible cleaning workflows and human review."
  value_fr: "Favorise des processus de nettoyage documentés, reproductibles et contrôlés."
  technologies: ["TypeScript", "SPSS", "Stata", "R", "Python"]
  repository: "https://github.com/bakodramane/DATA_CLEANING_SYNTAX_APP"
- id: sae
  name: "SAE Syntax Generator"
  category_en: "Small area estimation"
  category_fr: "Estimation sur petits domaines"
  challenge_en: "Applying specialised small area estimation methods can require complex and repetitive programming."
  challenge_fr: "L'application des méthodes d'estimation sur petits domaines nécessite souvent une programmation spécialisée."
  solution_en: "An offline-first web app that prepares annotated R and Stata code for a selection of area-level and unit-level SAE approaches."
  solution_fr: "Une application web utilisable hors connexion qui prépare des scripts R et Stata commentés pour diverses méthodes d'estimation sur petits domaines."
  value_en: "Makes statistical methods easier to explore, adapt and validate without concealing assumptions."
  value_fr: "Facilite l'exploration, l'adaptation et la validation des méthodes tout en rendant visibles les hypothèses."
  technologies: ["TypeScript", "PWA", "R", "Stata"]
  repository: "https://github.com/bakodramane/SAE_Syntax_Generator"
- id: pima
  name: "PIMA Diabetes Prediction"
  category_en: "Machine learning portfolio"
  category_fr: "Portfolio d'apprentissage automatique"
  challenge_en: "Demonstrating an end-to-end predictive modelling workflow on a standard educational dataset."
  challenge_fr: "Illustrer un processus complet de modélisation prédictive à partir d'un jeu de données pédagogique."
  solution_en: "A machine learning portfolio example using the PIMA Indians Diabetes dataset, from exploratory analysis through model evaluation."
  solution_fr: "Un exemple de projet d'apprentissage automatique utilisant le jeu PIMA Indians Diabetes, de l'exploration à l'évaluation du modèle."
  value_en: "Shows model development and evaluation techniques; not a clinical diagnostic product."
  value_fr: "Illustre la conception et l'évaluation de modèles ; il ne s'agit pas d'un outil de diagnostic médical."
  technologies: ["Python", "Machine learning", "Model evaluation"]
  repository: "https://github.com/bakodramane/PIMA_Diabetes_Prediction"
