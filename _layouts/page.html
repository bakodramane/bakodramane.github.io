---
layout: default
---
<article class="portfolio-page">
  <header class="page-header">
    {% if page.eyebrow %}<p class="eyebrow">{{ page.eyebrow }}</p>{% endif %}
    <h1 class="page-title">{{ page.title | escape }}</h1>
  </header>

  <div class="page-body">
    {{ content }}
  </div>
</article>
