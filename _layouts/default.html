<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
  {%- include head.html -%}
  <body>
    <a class="skip-link" href="#main-content">{% if page.lang == 'fr' %}Aller au contenu principal{% else %}Skip to main content{% endif %}</a>
    {%- include header.html -%}
    <main class="page-content" id="main-content" aria-label="{% if page.lang == 'fr' %}Contenu principal{% else %}Main content{% endif %}" tabindex="-1">
      <div class="wrapper">
        {{ content }}
      </div>
    </main>
    {%- include footer.html -%}
  </body>
</html>
