name: Portfolio build and internal links

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4
      - name: Install Ruby and cached gems
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Build site
        run: bundle exec jekyll build
      - name: Check built internal links
        run: python3 scripts/check_site_links.py _site
      - name: Check staged blog migration
        run: python3 scripts/check_migration.py _site
