name: Portfolio build and internal links

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4
      - name: Install Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: false
      - name: Install Linux-compatible site dependencies
        run: |
          # The existing Windows-only Gemfile.lock is preserved in Git.
          # Let Bundler resolve a compatible Linux lock in this ephemeral runner.
          rm Gemfile.lock
          bundle install --jobs 4
      - name: Build site
        run: bundle exec jekyll build
      - name: Check built internal links
        run: python3 scripts/check_site_links.py _site
