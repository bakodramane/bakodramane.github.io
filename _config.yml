title: "Dramane Bako | Statistician, Data Scientist & Researcher"
tagline: "Official statistics, survey methodology, agricultural statistics and responsible AI"
description: "The professional and academic portfolio of Dramane Bako: official statistics, research publications, agricultural surveys and censuses, data science, and responsible AI."
url: "https://bakodramane.github.io"
baseurl: ""
theme: minima
author:
  name: "Dramane Bako"
  email:
  url: "https://bakodramane.github.io/about/"
twitter:
  username:
  card: summary_large_image
social:
  name: "Dramane Bako"
  links:
    - "https://www.linkedin.com/in/bakodramane/"
    - "https://www.researchgate.net/profile/Dramane-Bako"
    - "https://github.com/bakodramane"
logo: "/assets/img/social-preview.png"
image: "/assets/img/social-preview.png"
markdown: kramdown
permalink: /:year/:month/:day/:title/
header_pages:
  - about.md
  - expertise.md
  - experience.md
  - publications.md
  - projects.md
  - insights.md
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: post
      author: "Dramane Bako"
      categories: [AI, Survey Research, Weekly Update]
      tags: [AI, surveys, official-statistics, administrative-data]
      lang: en
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
