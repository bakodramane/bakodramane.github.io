title: "Dramane Bako | Statistician, Data Scientist & Researcher"
tagline: "Official statistics, survey methodology, agricultural statistics and responsible AI"
description: "Professional and academic portfolio of Dramane Bako, statistician and data scientist. Research, agricultural surveys, statistical methodology and open-source work."
url: "https://bakodramane.github.io"
baseurl: ""
blog_url: "https://bakodramane.github.io/ai-official-statistics/"
blog_base: "https://bakodramane.github.io/ai-official-statistics"
theme: minima
author:
  name: "Dramane Bako"
  email:
  url: "https://bakodramane.github.io/about/"
twitter:
  username:
  card: summary_large_image
social:
  name: "Dramane Bako"
  links:
    - "https://www.linkedin.com/in/bakodramane/"
    - "https://www.researchgate.net/profile/Dramane-Bako"
    - "https://github.com/bakodramane"
logo: "/assets/img/social-preview.png"
image: "/assets/img/social-preview.png"
markdown: kramdown
permalink: /:year/:month/:day/:title/
header_pages:
  - about.md
  - expertise.md
  - experience.md
  - publications.md
  - projects.md
  - insights.md
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
# Former blog URLs. Each stub forwards to the same path on the independent
# blog (site.blog_base); the articles themselves live in the blog repository.
collections:
  legacy:
    output: true
defaults:
  - scope:
      path: ""
      type: "legacy"
    values:
      layout: blog-redirect
      sitemap: false
exclude:
  - README.md
  - docs
  - scripts
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
